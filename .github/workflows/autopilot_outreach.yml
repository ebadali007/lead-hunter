name: 24/7 Autonomous Lead Hunter & Outreach

on:
  schedule:
    # Runs 5 times every day (04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    # 5 runs x 12 leads = 60 high-ticket cold outreach emails per day
    - cron: '0 4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of businesses to hunt and pitch in this run'
        required: false
        default: '12'

permissions:
  contents: write

jobs:
  autonomous_hunt_and_pitch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with OS Dependencies
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Autonomous Hunting & Outreach Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MY_PERSONAL_EMAIL: ${{ secrets.MY_PERSONAL_EMAIL }}
          AGENCY_OWNER_WHATSAPP: ${{ secrets.AGENCY_OWNER_WHATSAPP }}
          DAILY_EMAIL_LIMIT: "60"
          AUTOPILOT_ENABLED: "true"
          SEND_LEAD_REPORTS_TO_OWNER: "false"
          MIN_OUTREACH_DELAY_SECONDS: "30"
          MAX_OUTREACH_DELAY_SECONDS: "75"
          HEADLESS_SCRAPER: "true"
        run: |
          BATCH=${{ github.event.inputs.batch_size || 12 }}
          python run_autopilot.py --cloud --batch $BATCH

      - name: Export GitHub Pages Live Viewer Data
        run: |
          python scripts/export_static_data.py

      - name: Persist SQLite Database & Leads to Repository
        run: |
          git config --global user.name "Lead Hunter 24/7 Cloud Bot"
          git config --global user.email "bot@leadhunter.cloud"
          git add lead_hunter.db docs/ screenshots/ static/screenshots/ agency_knowledge.txt || true
          git diff --staged --quiet || (git commit -m "chore(cloud): save autonomous leads, screenshots, docs & rotation state [skip ci]" && git push)
