services:
  - type: web
    name: lead-hunter
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium --with-deps
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTOPILOT_ENABLED
        value: "true"
      - key: HEADLESS_SCRAPER
        value: "true"
      - key: SENDER_NAME
        value: "Zai Ebad | Founder & Lead Developer"
      - key: AGENCY_NAME
        value: "Zai Ebad Digital"
      - key: AGENCY_OWNER_WHATSAPP
        value: "+923293246454"
      - key: DAILY_EMAIL_LIMIT
        value: "60"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MY_PERSONAL_EMAIL
        sync: false
